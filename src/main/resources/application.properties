# Database
spring.datasource.url=jdbc:mysql://localhost:3306/pidb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server
server.port=8087
server.servlet.context-path=/pi

# Disable security auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# application.properties
# Metrics & Monitoring
management.endpoints.web.exposure.include=*
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

python.service.url=http://localhost:5000/categorize
python.emotion.service.url=http://localhost:5000/detect-emotion