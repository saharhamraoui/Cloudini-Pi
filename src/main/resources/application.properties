spring.application.name=piDev
spring.datasource.url=jdbc:mysql://localhost:3306/piDevDeb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8085
server.servlet.context-path=/piDevDeb
# Désactive complètement la sécurité
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# Taille maximale des uploads

# Dossier temporaire (optionnel)
app.upload.temp-dir=temp-uploads/
# src/main/resources/application.properties
gemini.api.key=AIzaSyB7tkE5DFgCdMHRfW2PdZEmzhLeY9fT0KU
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect