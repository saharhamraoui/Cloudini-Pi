spring.config.import=optional:classpath:env.properties

spring.application.name=piDev
spring.datasource.url=jdbc:mysql://localhost:3306/piDevDeb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8085
server.servlet.context-path=/piDevDeb

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google AI API
google.ai.api.key=${GOOGLE_AI_API_KEY}

# Twilio
twilio.account.sid=${TWILIO_ACCOUNT_SID}
auth_token=${TWILIO_AUTH_TOKEN}
from_number=${TWILIO_FROM_NUMBER}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}

# Upload file limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hibernate lazy loading
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Jackson Hibernate proxies config
spring.jackson.serialization.fail-on-empty-beans=false