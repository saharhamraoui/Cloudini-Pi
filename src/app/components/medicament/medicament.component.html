<h2>Gestion des Médicaments</h2>

<!-- Form for adding Medicament -->
<form (ngSubmit)="addMedicament()">
  <input type="text" placeholder="Nom" [(ngModel)]="newMedicament.nom" name="nom" required>
  <input type="text" placeholder="Description" [(ngModel)]="newMedicament.description" name="description" required>
  <input type="number" placeholder="Quantité" [(ngModel)]="newMedicament.quantite" name="quantite" required>
  <input type="date" [(ngModel)]="newMedicament.dateExpiration" name="dateExpiration" required>
  <input type="number" placeholder="Prix" [(ngModel)]="newMedicament.prix" name="prix" required>
  <button type="submit">Ajouter Médicament</button>
</form>

<!-- Medicament List -->
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nom</th>
      <th>Description</th>
      <th>Quantité</th>
      <th>Date d'Expiration</th>
      <th>Prix</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let medicament of medicaments">
      <td>{{ medicament.idmedicament }}</td>
      <td>{{ medicament.nom }}</td>
      <td>{{ medicament.description }}</td>
      <td>{{ medicament.quantite }}</td>
      <td>{{ medicament.dateExpiration }}</td>
      <td>{{ medicament.prix }} TND</td>
      <td>
        <button (click)="deleteMedicament(medicament.idmedicament)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
