<a routerLink="/" class="btn btn-sm btn-secondary mb-3">
  <i class="fa-sharp fa-solid fa-arrow-left"></i>
</a>
<div class="heading-text"><b>Liste des Fournisseurs</b></div>


  <div class="search-bar" style="text-align: center; margin-bottom: 20px;">
    <input type="text" [(ngModel)]="searchTerm" (input)="searchFournisseursByMedicament()" 
           placeholder="Rechercher un médicament" 
           style="padding: 10px; width: 300px; border-radius: 8px; border: 1px solid #ccc;" />
  </div>
  <div class="row">
    <div *ngFor="let item of filteredFournisseurs" class="col-4 card" id="bloodCards">
      <div class="img-block">
        <div class="circle">
          <img class="bloodimg" [src]="'assets/images/supplier.png'" width="100" height="100" />
        </div>
      </div>
      <div class="card-block">
        <div class="text"><b style="color: #0e5551;">{{ item.nom }}</b></div>
        <div class="text"><b style="color: #0e5551;">{{ item.adresse }}</b></div>
        <div class="text" *ngIf="searchTerm">
          <b style="color: #0e5551;">Prix pour "{{ searchTerm }}": {{ getMedicamentPrice(item) }}€</b>
        </div>
      </div>
      <div class="status-btn">
        <button class="btn btn-success" [routerLink]="['/medicaments', item.idfournisseur]">Voir Médicaments</button>
        <button class="btn btn-primary" [routerLink]="['/fournisseur', item.idfournisseur]">Détails</button>
      </div>
    </div>
  </div>
  
  <br><br><br>
  <app-footer></app-footer>
