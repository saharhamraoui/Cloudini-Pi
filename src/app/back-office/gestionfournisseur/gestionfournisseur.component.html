<a routerLink="/" class="btn btn-outline-secondary mb-3">
    <i class="bi bi-arrow-left"></i> Retour au Dashboard
  </a>
<div class="container mt-4">
    <h3 class="mb-4">{{ isEditMode ? 'Modifier Fournisseur' : 'Ajouter Fournisseur' }}</h3>
  
    <!-- Form -->
    <form [formGroup]="fournisseurForm" (ngSubmit)="isEditMode ? updateFournisseur() : addFournisseur()">
      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" class="form-control" id="nom" formControlName="nom">
      </div>
      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input type="text" class="form-control" id="adresse" formControlName="adresse">
      </div>
      <div class="form-group">
        <label for="contact">Contact</label>
        <input type="text" class="form-control" id="contact" formControlName="contact">
      </div>
      <button type="submit" class="btn btn-primary mt-3">{{ isEditMode ? 'Mettre à jour' : 'Ajouter' }}</button>
    </form>
  
    <div *ngIf="errorMessage" class="alert alert-danger mt-3">
      {{ errorMessage }}
    </div>
  
    <h3 class="mt-4">Liste des Fournisseurs</h3>
    <ul class="list-group">
      <li *ngFor="let fournisseur of fournisseurs" class="list-group-item">
        {{ fournisseur.nom }} - {{ fournisseur.adresse }} - {{ fournisseur.contact }}
        <button class="btn btn-warning btn-sm float-end" (click)="editFournisseur(fournisseur)">Modifier</button>
        <button class="btn btn-danger btn-sm float-end me-2" (click)="deleteFournisseur(fournisseur.idfournisseur)">Supprimer</button>
      </li>
    </ul>
  </div>
